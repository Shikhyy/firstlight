services:
  - type: web
    name: firstlight-dashboard
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn -w 2 -b 0.0.0.0:$PORT 'firstlight.web.app:create_app()'"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    disk:
      name: firstlight-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  - type: cron
    name: firstlight-morning-run
    env: python
    schedule: "30 6 * * *"
    buildCommand: "./build.sh"
    startCommand: "firstlight run"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    disk:
      name: firstlight-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
