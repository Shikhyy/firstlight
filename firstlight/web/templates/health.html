{% extends "base.html" %}

{% block content %}
<h1 class="fraunces">System Health</h1>

<div style="overflow-x: auto;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="border-bottom: 1px solid var(--glass-border);">
                <th style="padding: 8px;">Source</th>
                <th style="padding: 8px;">Run At</th>
                <th style="padding: 8px;">Status</th>
                <th style="padding: 8px;">Items</th>
            </tr>
        </thead>
        <tbody>
            {% for r in runs %}
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                <td style="padding: 8px;">{{ r.source }}</td>
                <td style="padding: 8px; font-size: 13px;">{{ r.started_at[:16] }}</td>
                <td style="padding: 8px;">
                    {% if r.ok %}
                    <span style="color: var(--orb-teal);">OK</span>
                    {% else %}
                    <span style="color: var(--orb-coral);">FAIL</span>
                    {% endif %}
                </td>
                <td style="padding: 8px;">{{ r.items_found }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
